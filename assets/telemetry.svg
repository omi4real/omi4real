<svg width="100%" height="280" viewBox="0 0 850 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="850" height="280" rx="10" fill="url(#termGrad)"/>
  <rect x="0.5" y="0.5" width="849" height="279" rx="10" stroke="#30363d" stroke-width="1" fill="none"/>

  <!-- Window Header Bar -->
  <rect width="850" height="38" rx="10" fill="#161b22"/>
  <rect y="37" width="850" height="1" fill="#30363d"/>

  <!-- Window Controls -->
  <circle cx="25" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="45" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="19" r="6" fill="#27c93f"/>

  <!-- Terminal Title -->
  <text x="425" y="24" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="500" fill="#8b949e">
    omi@archbox: ~ (fastfetch)
  </text>

  <!-- Arch Linux ASCII Logo Left Side -->
  <g font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" fill="#1793d1" font-weight="700">
    <text x="50" y="80">        /\        </text>
    <text x="50" y="98">       /  \       </text>
    <text x="50" y="116">      /\   \      </text>
    <text x="50" y="134">     /      \     </text>
    <text x="50" y="152">    /   ,,   \    </text>
    <text x="50" y="170">   /   |  |  -\   </text>
    <text x="50" y="188">  /_-&apos;&apos;    &apos;&apos;-_\  </text>
  </g>

  <!-- Fastfetch Specs Right Side -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="400">
    <!-- User Prompt -->
    <text x="230" y="75" fill="#f0f6fc" font-weight="600">omi@archbox</text>
    <text x="230" y="90" fill="#30363d">----------------------------------------------</text>

    <!-- Info Specs -->
    <text x="230" y="112" fill="#8b949e">OS:</text>
    <text x="320" y="112" fill="#e6edf3">Arch Linux x86_64</text>

    <text x="230" y="132" fill="#8b949e">Kernel:</text>
    <text x="320" y="132" fill="#e6edf3">Linux (zen-kernel) / x86_64</text>

    <text x="230" y="152" fill="#8b949e">Shell:</text>
    <text x="320" y="152" fill="#e6edf3">zsh 5.9</text>

    <text x="230" y="172" fill="#8b949e">Toolchains:</text>
    <text x="320" y="172" fill="#e6edf3">GCC, Clang / LLVM, GNU Make, AnyKernel3</text>

    <text x="230" y="192" fill="#8b949e">Analysis / RE:</text>
    <text x="320" y="192" fill="#e6edf3">GDB, Ghidra, Frida, Smali / Baksmali</text>

    <text x="230" y="212" fill="#8b949e">Focus Areas:</text>
    <text x="320" y="212" fill="#e6edf3">Linux Kernel, Android Internals, Reverse Engineering</text>

    <text x="230" y="232" fill="#8b949e">Architecture:</text>
    <text x="320" y="232" fill="#e6edf3">x86_64 (Host) &#8594; AArch64 / ARMv8-A (Target)</text>

    <!-- Monochrome Accent Swatches -->
    <rect x="230" y="250" width="22" height="12" rx="2" fill="#000000"/>
    <rect x="256" y="250" width="22" height="12" rx="2" fill="#21262d"/>
    <rect x="282" y="250" width="22" height="12" rx="2" fill="#30363d"/>
    <rect x="308" y="250" width="22" height="12" rx="2" fill="#8b949e"/>
    <rect x="334" y="250" width="22" height="12" rx="2" fill="#c9d1d9"/>
    <rect x="360" y="250" width="22" height="12" rx="2" fill="#f0f6fc"/>
  </g>
</svg>
