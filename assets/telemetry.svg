<svg width="100%" height="280" viewBox="0 0 850 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window -->
  <rect width="850" height="280" rx="10" fill="url(#termGrad)"/>
  <rect x="0.5" y="0.5" width="849" height="279" rx="10" stroke="#30363d" stroke-width="1" fill="none"/>

  <!-- Window Header -->
  <rect width="850" height="38" rx="10" fill="#161b22"/>
  <rect y="37" width="850" height="1" fill="#30363d"/>

  <!-- Window Controls -->
  <circle cx="25" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="45" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="19" r="6" fill="#27c93f"/>

  <!-- Terminal Title -->
  <text x="425" y="24" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="500" fill="#8b949e">
    omi@narzo30a: ~ (neofetch)
  </text>

  <!-- ASCII Art Left Side -->
  <g font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#c9d1d9" font-weight="600">
    <text x="35" y="80">      .-&quot;&quot;-.     </text>
    <text x="35" y="98">     /  _ _  \    </text>
    <text x="35" y="116">    |  (o)(o) |   </text>
    <text x="35" y="134">   /           \  </text>
    <text x="35" y="152">  /  .-------.  \ </text>
    <text x="35" y="170"> |  / [ARM64] \  |</text>
    <text x="35" y="188"> |  \  MT6769 /  |</text>
    <text x="35" y="206">  \  &apos;-------&apos;  / </text>
    <text x="35" y="224">   `&apos;--.....--&apos;`  </text>
    <text x="35" y="242">   // omi4real \\ </text>
  </g>

  <!-- Neofetch Text Right Side -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="400">
    <!-- User Prompt -->
    <text x="230" y="75" fill="#f0f6fc" font-weight="600">omi@narzo30a</text>
    <text x="230" y="90" fill="#30363d">----------------------------------------------</text>

    <!-- Info Specs -->
    <text x="230" y="112" fill="#8b949e">OS:</text>
    <text x="320" y="112" fill="#e6edf3">Android 10 (AOSP / QASSA Custom ROM)</text>

    <text x="230" y="132" fill="#8b949e">Host:</text>
    <text x="320" y="132" fill="#e6edf3">Realme Narzo 30A [RMX3171]</text>

    <text x="230" y="152" fill="#8b949e">Kernel:</text>
    <text x="320" y="152" fill="#e6edf3">Linux 4.14.141+ aarch64 (Custom Tuned)</text>

    <text x="230" y="172" fill="#8b949e">SoC:</text>
    <text x="320" y="172" fill="#e6edf3">MediaTek MT6769V/CZ (Helio G85)</text>

    <text x="230" y="192" fill="#8b949e">Privilege:</text>
    <text x="320" y="192" fill="#e6edf3">MagiskSU 30.7 (Root / Systemless)</text>

    <text x="230" y="212" fill="#8b949e">Shell / IDE:</text>
    <text x="320" y="212" fill="#e6edf3">Zsh &amp; Bash @ Termux &bull; Neovim &bull; Git</text>

    <text x="230" y="232" fill="#8b949e">Focus:</text>
    <text x="320" y="232" fill="#e6edf3">Vendor Patches, Audio HALs &amp; Device Trees</text>

    <!-- Color Palette Blocks -->
    <rect x="230" y="250" width="22" height="12" rx="2" fill="#000000"/>
    <rect x="256" y="250" width="22" height="12" rx="2" fill="#21262d"/>
    <rect x="282" y="250" width="22" height="12" rx="2" fill="#30363d"/>
    <rect x="308" y="250" width="22" height="12" rx="2" fill="#8b949e"/>
    <rect x="334" y="250" width="22" height="12" rx="2" fill="#c9d1d9"/>
    <rect x="360" y="250" width="22" height="12" rx="2" fill="#f0f6fc"/>
  </g>
</svg>
