<svg width="100%" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }
    </style>
  </defs>

  <!-- Terminal Card -->
  <rect width="600" height="340" rx="8" fill="#08080a" stroke="#1f242c" stroke-width="1"/>

  <!-- Subtle Indentation Guide Lines -->
  <line x1="40" y1="46" x2="40" y2="102" stroke="#1f242c" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="142" x2="40" y2="198" stroke="#1f242c" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="238" x2="40" y2="294" stroke="#1f242c" stroke-width="1.5" stroke-linecap="round"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5px" xml:space="preserve">
    <!-- Command 1: cat ~/.profile -->
    <text x="28" y="32"><tspan fill="#7ee787">omi@tty1:~$</tspan><tspan fill="#e6edf3"> cat ~/.profile</tspan></text>
    <text x="56" y="54"><tspan fill="#e6edf3">omi (@omi4real) &#8212; linux </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> android systems developer.</tspan></text>
    <text x="56" y="76"><tspan fill="#e6edf3">living </tspan><tspan fill="#ff7b72">in</tspan><tspan fill="#e6edf3"> open terminals: testing, debugging </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> fixing</tspan></text>
    <text x="56" y="98"><tspan fill="#e6edf3">software across the framework </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> kernel layers.</tspan></text>

    <!-- Command 2: cat /etc/focus -->
    <text x="28" y="128"><tspan fill="#7ee787">omi@tty1:~$</tspan><tspan fill="#e6edf3"> cat /etc/focus</tspan></text>
    <text x="56" y="150"><tspan fill="#79c0ff">[systems]</tspan></text>
    <text x="165" y="150"><tspan fill="#e6edf3">linux os </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> shell scripting, cli automation</tspan></text>

    <text x="56" y="172"><tspan fill="#79c0ff">[android]</tspan></text>
    <text x="165" y="172"><tspan fill="#e6edf3">custom rom dev </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> porting, root modules</tspan></text>

    <text x="56" y="194"><tspan fill="#79c0ff">[low-level]</tspan></text>
    <text x="165" y="194"><tspan fill="#e6edf3">os optimization, debugging </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> audio tuning</tspan></text>

    <!-- Command 3: cat /proc/loop -->
    <text x="28" y="224"><tspan fill="#7ee787">omi@tty1:~$</tspan><tspan fill="#e6edf3"> cat /proc/loop</tspan></text>
    <text x="56" y="246"><tspan fill="#ff7b72">while</tspan><tspan fill="#e6edf3"> true; </tspan><tspan fill="#ff7b72">do</tspan></text>
    <text x="84" y="268"><tspan fill="#e6edf3">test </tspan><tspan fill="#ff7b72">||</tspan><tspan fill="#e6edf3"> debug </tspan><tspan fill="#ff7b72">&amp;&amp;</tspan><tspan fill="#e6edf3"> fix</tspan></text>
    <text x="56" y="290"><tspan fill="#ff7b72">done</tspan></text>

    <!-- Active Idle Prompt with Blinking Cursor -->
    <text x="28" y="318"><tspan fill="#7ee787">omi@tty1:~$</tspan><tspan fill="#e6edf3"> </tspan><tspan class="cursor" fill="#e6edf3">&#9608;</tspan></text>
  </g>
</svg>