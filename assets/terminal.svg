<svg width="100%" height="545" viewBox="0 0 360 545" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }
    </style>
  </defs>

  <rect width="360" height="545" rx="8" fill="#08080a" stroke="#1f242c" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14px" xml:space="preserve">
    <!-- Profile -->
    <text x="20" y="38"><tspan fill="#7ee787">omi@tty1:~$</tspan><tspan fill="#e6edf3"> cat ~/.profile</tspan></text>
    <text x="20" y="59"><tspan fill="#e6edf3">omi (@omi4real)</tspan></text>
    <text x="20" y="80"><tspan fill="#e6edf3">linux </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> android developer.</tspan></text>
    <text x="20" y="101"><tspan fill="#e6edf3">living </tspan><tspan fill="#ff7b72">in</tspan><tspan fill="#e6edf3"> open terminals&#8212;</tspan></text>
    <text x="20" y="122"><tspan fill="#e6edf3">testing, debugging </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> fixing</tspan></text>
    <text x="20" y="143"><tspan fill="#e6edf3">software at the system level.</tspan></text>

    <!-- Focus -->
    <text x="20" y="178"><tspan fill="#7ee787">omi@tty1:~$</tspan><tspan fill="#e6edf3"> cat /etc/focus</tspan></text>
    <text x="20" y="199"><tspan fill="#79c0ff">[systems]</tspan></text>
    <text x="36" y="220"><tspan fill="#e6edf3">linux os </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> shell scripting</tspan></text>
    <text x="36" y="241"><tspan fill="#e6edf3">cli tooling </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> automation</tspan></text>

    <text x="20" y="271"><tspan fill="#79c0ff">[android]</tspan></text>
    <text x="36" y="292"><tspan fill="#e6edf3">custom rom dev </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> porting</tspan></text>
    <text x="36" y="313"><tspan fill="#e6edf3">system apps </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> root modules</tspan></text>

    <text x="20" y="343"><tspan fill="#79c0ff">[low-level]</tspan></text>
    <text x="36" y="364"><tspan fill="#e6edf3">os optimization </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> debugging</tspan></text>
    <text x="36" y="385"><tspan fill="#e6edf3">hardware </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> audio tuning</tspan></text>

    <!-- Loop -->
    <text x="20" y="420"><tspan fill="#7ee787">omi@tty1:~$</tspan><tspan fill="#e6edf3"> cat /proc/loop</tspan></text>
    <text x="20" y="441"><tspan fill="#ff7b72">while</tspan><tspan fill="#e6edf3"> true; </tspan><tspan fill="#ff7b72">do</tspan></text>
    <text x="36" y="462"><tspan fill="#e6edf3">test </tspan><tspan fill="#ff7b72">||</tspan><tspan fill="#e6edf3"> debug </tspan><tspan fill="#ff7b72">&amp;&amp;</tspan><tspan fill="#e6edf3"> fix</tspan></text>
    <text x="20" y="483"><tspan fill="#ff7b72">done</tspan></text>

    <!-- Active Idle Prompt with Blinking Cursor -->
    <text x="20" y="518"><tspan fill="#7ee787">omi@tty1:~$</tspan><tspan fill="#e6edf3"> </tspan><tspan class="cursor" fill="#e6edf3">&#9608;</tspan></text>
  </g>
</svg>