<svg width="680" height="632" viewBox="0 0 680 632" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="632" rx="8" fill="#08080a" stroke="#1f242c" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15px" xml:space="preserve">
  <text x="28" y="44"><tspan fill="#7ee787">omi@tty1:~$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
  <text x="28" y="68"><tspan fill="#e6edf3">omi (@omi4real)</tspan></text>
  <text x="28" y="92"><tspan fill="#e6edf3">linux </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> android developer.</tspan></text>
  <text x="28" y="116"><tspan fill="#e6edf3">living </tspan><tspan fill="#ff7b72">in</tspan><tspan fill="#e6edf3"> open terminals—</tspan></text>
  <text x="28" y="140"><tspan fill="#e6edf3">testing, debugging </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> fixing</tspan></text>
  <text x="28" y="164"><tspan fill="#e6edf3">software at the system level.</tspan></text>
  <text x="28" y="212"><tspan fill="#7ee787">omi@tty1:~$</tspan><tspan fill="#e6edf3"> cat /etc/focus</tspan></text>
  <text x="28" y="236"><tspan fill="#79c0ff">[systems]</tspan></text>
  <text x="46" y="260"><tspan fill="#e6edf3">linux os </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> shell scripting</tspan></text>
  <text x="46" y="284"><tspan fill="#e6edf3">cli tooling </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> automation</tspan></text>
  <text x="28" y="332"><tspan fill="#79c0ff">[android]</tspan></text>
  <text x="46" y="356"><tspan fill="#e6edf3">custom rom dev </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> porting</tspan></text>
  <text x="46" y="380"><tspan fill="#e6edf3">system apps </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> root modules</tspan></text>
  <text x="28" y="428"><tspan fill="#79c0ff">[low-level]</tspan></text>
  <text x="46" y="452"><tspan fill="#e6edf3">os optimization </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> debugging</tspan></text>
  <text x="46" y="476"><tspan fill="#e6edf3">hardware </tspan><tspan fill="#ff7b72">&amp;</tspan><tspan fill="#e6edf3"> audio tuning</tspan></text>
  <text x="28" y="524"><tspan fill="#7ee787">omi@tty1:~$</tspan><tspan fill="#e6edf3"> cat /proc/loop</tspan></text>
  <text x="28" y="548"><tspan fill="#ff7b72">while</tspan><tspan fill="#e6edf3"> true; </tspan><tspan fill="#ff7b72">do</tspan></text>
  <text x="46" y="572"><tspan fill="#e6edf3">test </tspan><tspan fill="#ff7b72">||</tspan><tspan fill="#e6edf3"> debug </tspan><tspan fill="#ff7b72">&amp;&amp;</tspan><tspan fill="#e6edf3"> fix</tspan></text>
  <text x="28" y="596"><tspan fill="#ff7b72">done</tspan></text>
